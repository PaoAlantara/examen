<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contribuyentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Barra de Navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Control de Impuestos</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/contribuyentes}">Contribuyentes</a>
            <a class="nav-link" th:href="@{/impuestos}">Impuestos</a>
            <a class="nav-link" th:href="@{/declaraciones}">Declaraciones</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Lista de Contribuyentes</h2>
    <a th:href="@{/contribuyentes/nuevo}" class="btn btn-primary mb-3">Nuevo Contribuyente</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>CURP</th><th>Correo</th></tr>
        </thead>
        <tbody>
            <tr th:each="c : ${listaContribuyentes}">
                <td th:text="${c.idContribuyente}"></td>
                <td th:text="${c.nombre + ' ' + c.apPaterno}"></td>
                <td th:text="${c.curp}"></td>
                <td th:text="${c.correo}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
