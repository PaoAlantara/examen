<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Impuestos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Control de Impuestos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/contribuyentes}">Contribuyentes</a>
            <a class="nav-link active" th:href="@{/impuestos}">Impuestos</a>
            <a class="nav-link" th:href="@{/declaraciones}">Declaraciones</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Catálogo de Impuestos</h2>
    <h2>Catálogo de Impuestos</h2>
<a th:href="@{/impuestos/nuevo}" class="btn btn-primary mb-3">Nuevo Impuesto</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Periodo</th><th>Fecha Límite</th></tr>
        </thead>
        <tbody>
            <tr th:each="i : ${listaImpuestos}">
                <td th:text="${i.idImpuesto}"></td>
                <td th:text="${i.nombre}"></td>
                <td th:text="${i.periodo}"></td>
                <td th:text="${i.fechaLimite}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
