<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Declaración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Registro de Declaración</h2>

    <div class="card p-4 mt-3">
        <form th:action="@{/declaraciones/guardar}" th:object="${declaracion}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Contribuyente:</label>
                <!-- Menú desplegable que recorre la lista de contribuyentes de la BD -->
                <select class="form-select" th:field="*{contribuyente}" required>
                    <option value="">Seleccione un contribuyente...</option>
                    <option th:each="c : ${contribuyentes}" 
                            th:value="${c.idContribuyente}" 
                            th:text="${c.nombre + ' ' + c.apPaterno}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Impuesto:</label>
                <!-- Menú desplegable que recorre la lista de impuestos -->
                <select class="form-select" th:field="*{impuesto}" required>
                    <option value="">Seleccione un impuesto...</option>
                    <option th:each="i : ${impuestos}" 
                            th:value="${i.idImpuesto}" 
                            th:text="${i.nombre}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Importe:</label>
                <input type="number" step="0.01" class="form-control" th:field="*{importe}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Registro:</label>
                <input type="date" class="form-control" th:field="*{fechaRegistro}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones:</label>
                <textarea class="form-control" th:field="*{observaciones}" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/declaraciones}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
