<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Impuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Registro de Impuesto</h2>

    <div class="card p-4 mt-3">
        <form th:action="@{/impuestos/guardar}" th:object="${impuesto}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Nombre (Ej. ISR, IVA):</label>
                <input type="text" class="form-control" th:field="*{nombre}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Periodo (Ej. Mensual, Anual):</label>
                <input type="text" class="form-control" th:field="*{periodo}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha Límite:</label>
                <input type="date" class="form-control" th:field="*{fechaLimite}" required />
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/impuestos}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
